name: Android CI Build & Release APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*", "*.*.*" ]
  release:
    types: [ published, created ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build AutoFlix APK (Debug & Release)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable & normalize line endings
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Extract Version Name
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="latest"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK (R8 Optimized)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APKs with Version Tag
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "AutoFlix-${{ steps.version.outputs.tag }}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "AutoFlix-${{ steps.version.outputs.tag }}-release.apk"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoFlix-${{ steps.version.outputs.tag }}-debug-apk
          path: AutoFlix-${{ steps.version.outputs.tag }}-debug.apk
          if-no-files-found: error

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoFlix-${{ steps.version.outputs.tag }}-release-apk
          path: AutoFlix-${{ steps.version.outputs.tag }}-release.apk
          if-no-files-found: error

      - name: Attach APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            AutoFlix-${{ steps.version.outputs.tag }}-release.apk
            AutoFlix-${{ steps.version.outputs.tag }}-debug.apk
          generate_release_notes: true
